<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
    <title>かずであそぼう！</title>
    <!-- Google Fonts for UI (Outfit / M PLUS Rounded 1c) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <!-- Titlescreen -->
        <section id="screen-title" class="screen active">
            <div class="title-content">
                <h1 class="bounce-in">かずであそぼう！</h1>
                <div class="mascot-container title-mascot">
                    <div class="mascot">🐰</div>
                </div>
            </div>
            <button class="btn btn-primary pulse" id="btn-start">スタート</button>
        </section>

        <!-- Stage Select Screen -->
        <section id="screen-stage-select" class="screen hidden">
            <h2 class="slide-down">どれにする？</h2>
            <div class="stage-grid">
                <button class="btn btn-stage" data-stage="1">＋ １</button>
                <button class="btn btn-stage" data-stage="2">＋ ２</button>
                <button class="btn btn-stage" data-stage="3">＋ ３</button>
                <button class="btn btn-stage" data-stage="5">＋ ５</button>
            </div>
            <button class="btn btn-secondary mt-auto" id="btn-back-title">もどる</button>
        </section>

        <!-- Gameplay Screen -->
        <section id="screen-play" class="screen hidden">
            <div class="top-bar slide-down">
                <button class="btn btn-icon" id="btn-quit">✖️</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="star-count">⭐ <span id="star-text">0</span></div>
            </div>

            <div class="play-main">
                <div class="problem-area zoom-in">
                    <div class="visuals" id="visuals-left"></div>
                    <div class="operator">＋</div>
                    <div class="visuals" id="visuals-right"></div>
                </div>

                <div class="equation">
                    <span id="num-left">2</span> ＋ <span id="num-right">1</span> ＝ <span id="num-answer">？</span>
                </div>

                <!-- Mascot reaction: inline toast between equation and choices -->
                <div class="reaction-toast hidden" id="reaction-mascot">
                    <span class="reaction-emoji" id="reaction-emoji">🐶</span>
                    <span class="reaction-text" id="mascot-speech">やったね！</span>
                </div>
            </div>

            <div class="choices-area fade-in-up" id="choices-container">
                <!-- Choices injected by JS -->
            </div>
        </section>

        <!-- Result Screen -->
        <section id="screen-result" class="screen hidden">
            <div class="result-content">
                <h2 class="bounce-in">すごい！</h2>
                <div class="medal-container zoom-in ripple">🏅</div>
                <p class="result-message">がんばったね！</p>
            </div>
            <div class="result-actions fade-in-up">
                <button class="btn btn-primary" id="btn-retry-stage">もういちど</button>
                <button class="btn btn-secondary" id="btn-to-stage-select">ちがうかたち</button>
            </div>
        </section>
    </div>

    <!-- Audio Elements (Using Base64 generic pleasant sounds or simple web audio synth in JS to avoid asset loading issues) -->

    <script src="app.js"></script>
</body>

</html>
