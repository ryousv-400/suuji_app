<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff8a65">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="10のまとまりでたしざんがすきになる、こどもむけさんすうゲーム">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <title>かずであそぼう！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <!-- Title Screen -->
        <section id="screen-title" class="screen active">
            <div class="title-content">
                <h1 class="bounce-in">かずで<br>あそぼう！</h1>
                <div class="mascot-container title-mascot">
                    <img src="assets/mascot_rabbit.png" class="mascot img-mascot" alt="うさぎ">
                </div>
                <div class="total-stars" id="total-stars-badge">⭐ <span id="total-stars">0</span></div>
                <div class="friends-row" id="friends-row"></div>
            </div>
            <button class="btn btn-primary pulse" id="btn-start">あそぶ！</button>
        </section>

        <!-- Stage Select Screen -->
        <section id="screen-stage-select" class="screen hidden">
            <h2 class="slide-down">どれで あそぶ？</h2>
            <div class="stage-list" id="stage-list">
                <!-- Stage buttons injected by JS -->
            </div>
            <button class="btn btn-secondary mt-auto" id="btn-back-title">もどる</button>
        </section>

        <!-- Gameplay Screen -->
        <section id="screen-play" class="screen hidden">
            <div class="top-bar slide-down">
                <button class="btn btn-icon" id="btn-quit" aria-label="やめる">✕</button>
                <div class="progress-track" id="progress-track">
                    <!-- Progress dots injected by JS -->
                </div>
                <div class="star-count">⭐ <span id="star-text">0</span></div>
            </div>

            <div class="play-main">
                <div class="problem-area zoom-in" id="problem-area">
                    <div class="frames-block" id="visuals-left"></div>
                    <div class="operator">＋</div>
                    <div class="frames-block" id="visuals-right"></div>
                </div>

                <div class="hint-banner hidden" id="hint-banner"></div>

                <div class="equation" id="equation">
                    <span id="num-left">2</span><span class="eq-op">＋</span><span id="num-right">1</span><span
                        class="eq-op">＝</span><span id="num-answer" class="answer-slot">？</span>
                </div>

                <div class="reaction-toast hidden" id="reaction-mascot">
                    <img src="assets/mascot_rabbit.png" class="img-reaction" alt="うさぎ">
                    <span class="reaction-text" id="mascot-speech">やったね！</span>
                </div>
            </div>

            <div class="choices-area fade-in-up" id="choices-container"></div>
        </section>

        <!-- Result Screen -->
        <section id="screen-result" class="screen hidden">
            <div class="result-content">
                <h2 class="bounce-in" id="result-title">すごい！</h2>
                <div class="medal-container zoom-in ripple">
                    <img src="assets/medal.png" class="img-medal" alt="メダル">
                </div>
                <div class="result-stars" id="result-stars"></div>
                <p class="result-message" id="result-message">がんばったね！</p>
                <div class="friend-unlock hidden" id="friend-unlock"></div>
            </div>
            <div class="result-actions fade-in-up">
                <button class="btn btn-primary" id="btn-retry-stage">もういちど</button>
                <button class="btn btn-secondary" id="btn-to-stage-select">ちがうのに する</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('[App] Service Worker registered:', reg.scope))
                    .catch((err) => console.warn('[App] Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
